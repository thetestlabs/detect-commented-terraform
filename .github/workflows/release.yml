name: Release
run-name: Release Workflow initiated by ${{ github.actor }}

# Ensure only one release runs at a time
# Do not cancel in-progress releases to avoid partial releases
concurrency:
  group: release
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v2
        id: generate_token
        with:
          app-id: ${{ secrets.THETESTLABS_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.THETESTLABS_RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests before release
        run: uv run pytest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install semantic-release
        run: |
          npm install -g semantic-release
          npm install -g @semantic-release/changelog
          npm install -g @semantic-release/git
          npm install -g @semantic-release/github
          npm install -g @semantic-release/exec

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for release conditions
        run: |
          echo "🔍 Checking for release conditions..."
          git log --oneline -10
          echo "📝 Recent commits shown above"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          echo "🚀 Running semantic-release..."
          semantic-release

      - name: Get new version
        id: version
        run: |
          VERSION=$(uv run python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version determined: $VERSION"

      - name: Build package for release
        if: steps.version.outputs.version != ''
        run: |
          echo "📦 Building package for version ${{ steps.version.outputs.version }}"
          uv build
          echo "✅ Package built successfully"

    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.version != '' }}

  publish:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'

    # environment:
    #   name: pypi
    #   url: https://pypi.org/p/detect-commented-terraform

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Build package
        run: |
          echo "📦 Building package for PyPI publication..."
          uv build
          echo "✅ Package built successfully"

      - name: Verify package
        run: |
          echo "🔍 Verifying package integrity..."
          uv run twine check dist/*
          echo "✅ Package verification passed"

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          print-hash: true
        continue-on-error: true

      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}
      #     skip-existing: true

      # yamllint disable rule:line-length
      - name: Notify successful release
        run: |
          echo "🎉 Successfully released v${{ needs.release.outputs.version }} to Test PyPI!"
          echo "📦 Package: https://test.pypi.org/project/detect-commented-terraform/${{ needs.release.outputs.version }}/"
          echo "🏷️  Release: https://github.com/thetestlabs/detect-commented-terraform/releases/tag/v${{ needs.release.outputs.version }}"
      # yamllint enable rule:line-length
